spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/usochicamochadb?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:UsoChicamocha2@}
spring.datasource.driver-class-name=org.postgresql.Driver

# Zona horaria: Colombia (UTC-5)
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

jwt.issuer.generator=${JWT_ISSUER:UsochimochaBackend}
jwt.secret.password=${JWT_SECRET:932aea0e6a85a4e55ac59d87f70aa47ec05b25709ad2ec95854771209849eb00}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway — BD de producción existente sin historial previo de Flyway
# baseline-on-migrate: crea registro en V0 si no existe flyway_schema_history.
# baseline-version=0: todas las migraciones V1+ se aplican sobre la BD antigua.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Protección de /uploads (fotos de evidencia, documentos, licencias). "registrar" deja pasar todo y
# anota en el log cada acceso sin credencial ("[UPLOADS] Acceso sin credencial"); "exigir" responde 401.
# Cambiar a exigir (variable UPLOADS_PROTECCION=exigir, sin recompilar) solo cuando la web y el backend
# actuales estén en producción, los teléfonos tengan el APK que envía ?k= y el log ya no muestre esos avisos.
app.uploads.proteccion=${UPLOADS_PROTECCION:registrar}
